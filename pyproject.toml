[project]
name = "ppviz"
version = "0.1.0"
description = "Pandapower grid visualization web app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pandapower==3.3.2",
    "python-multipart>=0.0.12",
    "igraph>=1.0.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
